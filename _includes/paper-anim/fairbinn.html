<figure class="anim" data-anim="fairbinn" data-duration="9">
  <svg viewBox="0 0 760 358" role="img" aria-label="Schematic of FairBiNN training: the accuracy player (leader) and the fairness player (follower) take turns updating their own layers."></svg>
  <div class="anim__bar">
    <figcaption class="anim__caption"><span class="anim__tag">Schematic</span>FairBiNN splits one network between two players. The <b>accuracy player</b> (leader) owns most layers and minimizes BCE. The <b>fairness player</b> (follower) owns a small block of fairness layers and minimizes the demographic-parity loss. Training alternates between their updates, which is a Stackelberg game.</figcaption>
    <button type="button" class="anim__toggle" aria-label="Pause animation"><i class="fas fa-pause" aria-hidden="true"></i></button>
  </div>
</figure>
